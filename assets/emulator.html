<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Emulator</title>
<style>
    html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
    #game-container { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="game-container"></div>

<script>
    /* Every launch navigates this page fresh (it's loaded in a new iframe each
       time), so EmulatorJS's globals only ever get declared once per page —
       that's what avoids the "already declared" crash from reusing one page. */
    const params = new URLSearchParams(location.search);

    window.EJS_player = "#game-container";
    window.EJS_core = params.get('core');
    window.EJS_gameUrl = params.get('game') || '';
    window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
    window.EJS_gameName = params.get('name') || 'Game';
    window.EJS_color = params.get('color') || '#7c3aed';
    window.EJS_startOnLoaded = true;
    // Custom default-control injection removed for now — it was the one
    // non-standard piece here and lines up with where the crash starts.
    // Bind keys per-game instead via EmulatorJS's own gear-icon menu
    // in the player until this is revisited.

    const script = document.createElement('script');
    script.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
    document.body.appendChild(script);
</script>
</body>
</html>
